workflows:
  ios_adhoc_manual:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: 🧹 Clean & Prepare
        script: |
          set -e
          flutter clean
          flutter pub get
          flutter precache --ios
          mkdir -p ios/Flutter
          for cfg in Release Debug Profile; do
            touch ios/Flutter/$cfg.xcconfig
          done

      - name: 📦 Install CocoaPods
        script: |
          set -e
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: 🧱 Fix Flutter.framework (engine slice ensure)
        script: |
          set -e
          echo "🧱 Preparing Flutter.framework for iOS device..."

          CANDIDATES=(
            "/Users/builder/programs/flutter"
            "$HOME/programs/flutter"
            "/opt/homebrew/Caskroom/flutter/latest/flutter"
            "/usr/local/Caskroom/flutter/latest/flutter"
          )

          FLUTTER_SDK=""
          for ROOT in "${CANDIDATES[@]}"; do
            if [ -d "$ROOT/bin/cache/artifacts/engine" ]; then
              FLUTTER_SDK="$ROOT"
              break
            fi
          done

          if [ -z "$FLUTTER_SDK" ]; then
            echo "❌ Could not locate Flutter SDK."
            exit 1
          fi

          echo "📍 Flutter SDK path: $FLUTTER_SDK"
          flutter precache --ios

          ENGINE_DIR="$FLUTTER_SDK/bin/cache/artifacts/engine"
          DEVICE_SLICE=$(find "$ENGINE_DIR" -type d \
            \( -path "*/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework" \
            -o -path "*/ios-release/extension_safe/Flutter.xcframework/ios-arm64/Flutter.framework" \) \
            | head -n 1 || true)

          if [ -z "$DEVICE_SLICE" ]; then
            echo "⚠️ ios-release slice not found, trying ios-profile..."
            DEVICE_SLICE=$(find "$ENGINE_DIR" -type d \
              \( -path "*/ios-profile/Flutter.xcframework/ios-arm64/Flutter.framework" \
              -o -path "*/ios-profile/extension_safe/Flutter.xcframework/ios-arm64/Flutter.framework" \) \
              | head -n 1 || true)
          fi

          if [ -z "$DEVICE_SLICE" ]; then
            echo "❌ Flutter.framework slice not found under $ENGINE_DIR"
            find "$ENGINE_DIR" -name "Flutter.framework" || true
            exit 1
          fi

          mkdir -p ios/Flutter
          rm -rf ios/Flutter/Flutter.framework
          cp -R "$DEVICE_SLICE" ios/Flutter/
          echo "✅ Copied Flutter.framework from: $DEVICE_SLICE"
          ls ios/Flutter/Flutter.framework/Headers || (echo "❌ Headers missing!" && exit 1)

      - name: 🧩 Ensure Flutter.framework Search Path
        script: |
          set -e
          echo "🧩 Ensuring Xcode project knows where Flutter.framework is..."
          PLIST="ios/Runner.xcodeproj/project.pbxproj"
          if ! grep -q '$(PROJECT_DIR)/Flutter' "$PLIST"; then
            echo "⚙️ Adding Flutter.framework path to FRAMEWORK_SEARCH_PATHS..."
            sed -i '' 's/FRAMEWORK_SEARCH_PATHS = (/FRAMEWORK_SEARCH_PATHS = (\n\t\t\t"$(PROJECT_DIR)\/Flutter",/' "$PLIST"
          else
            echo "✅ Flutter.framework path already set."
          fi

      - name: 🧱 Patch Podfile for Flutter.framework
        script: |
          set -e
          echo "🧱 Patching Podfile to ensure all pods see Flutter.framework..."
          if ! grep -q "post_install do" ios/Podfile; then
            cat <<'RUBY' >> ios/Podfile

# --- Codemagic auto patch: ensure all pods can find Flutter.framework ---
  post_install do |installer|
  installer.pods_project.targets.each do |target|
  flutter_framework_path = File.join(File.dirname(__FILE__), 'Flutter')
  target.build_configurations.each do |config|
  config.build_settings['FRAMEWORK_SEARCH_PATHS'] ||= ['$(inherited)']
  unless config.build_settings['FRAMEWORK_SEARCH_PATHS'].include?(flutter_framework_path)
  config.build_settings['FRAMEWORK_SEARCH_PATHS'] << flutter_framework_path
  end
  end
  end
  end
  # --- End patch ---
  RUBY
  else
  echo "✅ Podfile already patched."
  fi

- name: 🧼 Reinstall Pods cleanly
  script: |
    set -e
    echo "🧼 Cleaning Pods and iOS caches..."
    cd ios
    rm -rf Pods Podfile.lock Flutter/Flutter.framework
    pod cache clean --all
    pod install
    cd ..

- name: 🧱 Build Flutter iOS (Release No-Codesign)
  script: |
    set -e
    echo "🚀 Building Flutter iOS..."
    
    CANDIDATES=(
      "/Users/builder/programs/flutter"
      "$HOME/programs/flutter"
      "/opt/homebrew/Caskroom/flutter/latest/flutter"
      "/usr/local/Caskroom/flutter/latest/flutter"
    )
    
    FLUTTER_SDK=""
    for ROOT in "${CANDIDATES[@]}"; do
      if [ -d "$ROOT/bin/cache/artifacts/engine" ]; then
        FLUTTER_SDK="$ROOT"
        break
      fi
    done
    
    if [ -z "$FLUTTER_SDK" ]; then
      echo "❌ Could not locate Flutter SDK."
      exit 1
    fi
    
    echo "📍 Flutter SDK path: $FLUTTER_SDK"
    flutter precache --ios
    
    ENGINE_DIR="$FLUTTER_SDK/bin/cache/artifacts/engine"
    DEVICE_SLICE=$(find "$ENGINE_DIR" -type d \
      \( -path "*/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework" \
      -o -path "*/ios-release/extension_safe/Flutter.xcframework/ios-arm64/Flutter.framework" \) \
      | head -n 1 || true)
    
    if [ -z "$DEVICE_SLICE" ]; then
      echo "⚠️ Flutter.framework slice not found, trying ios-profile..."
      DEVICE_SLICE=$(find "$ENGINE_DIR" -type d \
        \( -path "*/ios-profile/Flutter.xcframework/ios-arm64/Flutter.framework" \
        -o -path "*/ios-profile/extension_safe/Flutter.xcframework/ios-arm64/Flutter.framework" \) \
        | head -n 1 || true)
    fi
    
    if [ -z "$DEVICE_SLICE" ]; then
      echo "❌ Flutter.framework (ios-arm64) not found under $ENGINE_DIR"
      find "$ENGINE_DIR" -name "Flutter.framework" || true
      exit 1
    fi
    
    mkdir -p ios/Flutter
    rm -rf ios/Flutter/Flutter.framework
    cp -R "$DEVICE_SLICE" ios/Flutter/
    echo "✅ Copied Flutter.framework from: $DEVICE_SLICE"
    
    echo "📂 Checking Flutter.framework headers:"
    ls ios/Flutter/Flutter.framework/Headers || (echo "❌ Still missing headers!" && exit 1)
    
    flutter build ios --release --no-codesign

- name: 🚀 Build iOS Archive (Ad Hoc)
  script: |
    set -e
    mkdir -p build/ios/archive
    xcodebuild archive \
      -workspace ios/Runner.xcworkspace \
      -scheme Runner \
      -configuration Release \
      -archivePath build/ios/archive/Runner.xcarchive \
      -destination 'generic/platform=iOS' \
      CODE_SIGN_STYLE=Manual \
      DEVELOPMENT_TEAM="${TEAM_ID}" \
      CODE_SIGN_IDENTITY="${CERT_NAME}" \
      PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
      CODE_SIGNING_ALLOWED=YES \
      CODE_SIGNING_REQUIRED=YES

- name: 📦 Export Signed IPA
  script: |
    set -e
    xcodebuild -exportArchive \
      -archivePath build/ios/archive/Runner.xcarchive \
      -exportOptionsPlist ios/exportOptions_adhoc.plist \
      -exportPath build/ios/ipa
    echo "✅ IPA exported successfully!"
    find build/ios/ipa -name "*.ipa"

artifacts:
  - build/ios/ipa/*.ipa
