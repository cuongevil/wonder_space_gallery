workflows:
  ios_adhoc_final:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: 🧹 Clean Flutter & pub get
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: 📦 Install Pods (repo-update)
        script: |
          set -e
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..
          echo "✅ Pods installed successfully."

      - name: 🚀 Build Flutter iOS (no codesign)
        script: |
          set -e
          echo "🚀 flutter build ios --release --no-codesign"
          flutter build ios --release --no-codesign -v

      - name: 🏗️ Archive (manual signing)
        script: |
          set -e
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export IPA
        script: |
          set -e
          cat > ios/exportOptions_adhoc.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ctmd.wonderforge.wonderspace.gallery</key>
              <string>wonderspace_gallery_adhoc</string>
            </dict>
            <key>teamID</key>
            <string>CS2UV6F3ZY</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa

          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
