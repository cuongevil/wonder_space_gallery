workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "WonderSpaceGallery_AppStore_Profile"

    scripts:
      - name: 🧹 Clean & deps
        script: |
          set -e
          flutter clean
          flutter pub get
          flutter precache --ios

      - name: 🔨 Build Flutter iOS (no codesign) — FIRST
        script: |
          set -e
          echo "🔨 flutter build ios --release --no-codesign"
          flutter build ios --release --no-codesign

          # Fallback: nếu Flutter.h chưa có, tự liên kết từ xcframework
          if [ ! -f "ios/Flutter/Flutter.framework/Headers/Flutter.h" ]; then
            echo "⚠️ Flutter.h missing after build. Trying to link from Flutter.xcframework..."
            mkdir -p ios/Flutter
            # Tìm SDK thực
            if command -v greadlink &>/dev/null; then
              FLUTTER_BIN_PATH=$(greadlink -f "$(which flutter)")
            else
              FLUTTER_BIN_PATH=$(readlink "$(which flutter)" || which flutter)
            fi
            if [[ ! "$FLUTTER_BIN_PATH" == */flutter ]]; then
              FLUTTER_BIN_PATH=$(ls -l "$(which flutter)" | awk '{print $NF}')
            fi
            FLUTTER_SDK_ROOT=$(dirname $(dirname "$FLUTTER_BIN_PATH"))
            ENGINE_DIR="${FLUTTER_SDK_ROOT}/bin/cache/artifacts/engine"

            # Ưu tiên xcframework slice thiết bị
            XC_SLICE=$(find "$ENGINE_DIR" -type d -path "*/Flutter.xcframework/ios-arm64/Flutter.framework" | head -n 1)
            if [ -z "$XC_SLICE" ]; then
              XC_SLICE=$(find "$ENGINE_DIR" -type d -path "*/Flutter.xcframework/ios-arm64_armv7/Flutter.framework" | head -n 1)
            fi
            if [ -z "$XC_SLICE" ]; then
              # fallback bất kỳ Flutter.framework
              XC_SLICE=$(find "$ENGINE_DIR" -type d -path "*/Flutter.framework" | head -n 1)
            fi

            if [ -n "$XC_SLICE" ]; then
              echo "✅ Linking Flutter.framework from: $XC_SLICE"
              rm -rf ios/Flutter/Flutter.framework
              cp -R "$XC_SLICE" ios/Flutter/Flutter.framework
            else
              echo "❌ Could not find Flutter.framework slice in engine cache."
              ls -R "$ENGINE_DIR" || true
              exit 1
            fi

            if [ -f "ios/Flutter/Flutter.framework/Headers/Flutter.h" ]; then
              echo "✅ Flutter.h now present."
            else
              echo "❌ Flutter.h still missing."
              exit 1
            fi
          else
            echo "✅ Flutter.h present after build."
          fi

      - name: 📦 CocoaPods install — AFTER build
        script: |
          set -e
          cd ios
          pod repo update
          pod install
          cd ..

      - name: 🚀 Archive (App Store)
        script: |
          set -e
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export IPA (App Store)
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_appstore.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported."

      - name: 📋 List IPA
        script: |
          find build/ios/ipa -type f -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa

