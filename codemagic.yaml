workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "WonderSpaceGallery_AppStore_Profile"

    scripts:
      - name: 🧹 Clean & Prepare
        script: |
          set -e
          echo "🧹 Cleaning Flutter and updating Pods..."
          flutter clean
          flutter pub get
          cd ios
          pod deintegrate
          pod repo update
          pod install --repo-update
          cd ..
          echo "✅ Environment ready."

      - name: 🧾 Create exportOptions.plist
        script: |
          set -e
          mkdir -p build/ios
          cat > build/ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          echo "✅ exportOptions.plist created."

      - name: 🚀 Build iOS Release (Archive)
        script: |
          set -e
          echo "🚀 Starting Xcode archive..."
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            clean archive | xcpretty
          echo "✅ Archive completed."

      - name: 🔧 Fix CFBundleIdentifiers in Frameworks
        script: |
          set -e
          echo "🔧 Checking and fixing framework Info.plist identifiers..."
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          find "$APP_PATH/Frameworks" -name Info.plist | while read plist; do
            CURRENT_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$plist" 2>/dev/null || true)
            if [ -z "$CURRENT_ID" ]; then
              FRAMEWORK_NAME=$(basename "$(dirname "$plist")" .framework)
              FIXED_ID="${BUNDLE_ID}.${FRAMEWORK_NAME}"
              echo "⚙️ Adding CFBundleIdentifier: $FIXED_ID"
              /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $FIXED_ID" "$plist" || \
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $FIXED_ID" "$plist" || true
            fi
          done
          echo "✅ All framework Info.plist files sanitized."

      - name: 📦 Export IPA (Final)
        script: |
          set -e
          echo "📦 Exporting signed IPA..."
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist build/ios/exportOptions.plist \
            -exportPath build/ios/ipa \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES | xcpretty
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA
        script: |
          echo "📂 Generated IPA files:"
          find build/ios/ipa -type f -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
