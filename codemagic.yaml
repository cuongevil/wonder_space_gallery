workflows:
  ios_adhoc_final:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      # 1. FLUTTER CLEAN + PUB GET
      - name: Clean Flutter
        script: |
          set -e
          flutter clean
          flutter pub get

      # 2. REBUILD ios/Flutter/*.xcconfig CHUẨN FLUTTER + COCOAPODS
      - name: Rebuild Flutter xcconfig
        script: |
          set -e
          mkdir -p ios/Flutter

          cat > ios/Flutter/Debug.xcconfig << 'EOF'
          #include "Pods/Target Support Files/Pods-Runner/Pods-Runner.debug.xcconfig"
          #include "Generated.xcconfig"
          EOF

          cat > ios/Flutter/Profile.xcconfig << 'EOF'
          #include "Pods/Target Support Files/Pods-Runner/Pods-Runner.profile.xcconfig"
          #include "Generated.xcconfig"
          EOF

          cat > ios/Flutter/Release.xcconfig << 'EOF'
          #include "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"
          #include "Generated.xcconfig"
          EOF

          echo "✅ Recreated ios/Flutter/*.xcconfig."

      # 3. POD INSTALL
      - name: Install Pods
        script: |
          set -e
          cd ios
          rm -rf Podfile.lock
          pod repo update
          pod install --verbose
          cd ..
          echo "✅ Pods installed."

      # 4. ĐẢM BẢO Flutter.framework (ARM64)
      - name: Ensure Flutter.framework (ARM64 ONLY)
        script: |
          set -e
          flutter precache --ios

          ENGINE=$(find $HOME/programs/flutter/bin/cache/artifacts/engine -name ios-release -type d | head -1)
          echo "ENGINE PATH: $ENGINE"

          mkdir -p ios/Flutter
          rm -rf ios/Flutter/Flutter.framework

          if [ -d "$ENGINE/Flutter.xcframework/ios-arm64/Flutter.framework" ]; then
            cp -R "$ENGINE/Flutter.xcframework/ios-arm64/Flutter.framework" ios/Flutter/
          elif [ -d "$ENGINE/Flutter.xcframework/ios-arm64_armv7/Flutter.framework" ]; then
            cp -R "$ENGINE/Flutter.xcframework/ios-arm64_armv7/Flutter.framework" ios/Flutter/
          else
            echo "❌ Không tìm thấy Flutter.framework slice phù hợp."
            find "$ENGINE" -name "Flutter.framework"
            exit 1
          fi

          ls ios/Flutter/Flutter.framework/Headers || (echo "❌ Thiếu Headers của Flutter.framework" && exit 1)
          echo "✅ Flutter.framework ok."

      # 5. PATCH SEARCH PATHS TRONG Runner.xcodeproj (CHO CHẮC ĂN)
      - name: Patch Runner.xcodeproj search paths
        script: |
          set -e
          FILE="ios/Runner.xcodeproj/project.pbxproj"
          echo "🔧 Patching $FILE ..."

          # Thêm $(PROJECT_DIR)/Flutter vào FRAMEWORK_SEARCH_PATHS nếu chưa có
          if ! grep -q '\$(PROJECT_DIR)/Flutter' "$FILE"; then
            sed -i '' 's/FRAMEWORK_SEARCH_PATHS = (/FRAMEWORK_SEARCH_PATHS = (\n				"$(PROJECT_DIR)\/Flutter",/g' "$FILE"
          fi

          # Thêm header path cho Flutter.framework
          if ! grep -q 'Flutter.framework/Headers' "$FILE"; then
            sed -i '' 's/HEADER_SEARCH_PATHS = (/HEADER_SEARCH_PATHS = (\n				"$(PROJECT_DIR)\/Flutter\/Flutter.framework\/Headers",/g' "$FILE"
          fi

          echo "✅ Updated FRAMEWORK_SEARCH_PATHS & HEADER_SEARCH_PATHS."

      # 6. BUILD FLUTTER IOS (NO CODESIGN) + BẮT LỖI XCODE RÕ RÀNG
      - name: Build Flutter iOS
        script: |
          set -e
          echo "🚀 flutter build ios --release --no-codesign -v"

          # Không để set -e làm dừng ngay, để còn phân tích log
          set +e
          flutter build ios --release --no-codesign -v | tee flutter_build.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ $STATUS -ne 0 ]; then
            echo "❌ Flutter build failed, trying to extract Xcode errors..."
            echo "===== Last 80 lines (full) ====="
            tail -n 80 flutter_build.log || true

            echo "===== Error (Xcode) lines ====="
            grep -n "Error (Xcode)" flutter_build.log | tail -n 20 || echo "No 'Error (Xcode)' lines found"

            echo "===== ' error:' lines ====="
            grep -n " error:" flutter_build.log | tail -n 40 || echo "No ' error:' lines found"

            exit $STATUS
          fi

          echo "✅ Flutter iOS build succeeded."

      # 7. ARCHIVE IPA (SIGNED)
      - name: Archive AdHoc IPA
        script: |
          set -e
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      # 8. EXPORT IPA
      - name: Export IPA
        script: |
          set -e
          cat > ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ctmd.wonderforge.wonderspace.gallery</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build/ios/ipa

          echo "✅ IPA exported:"
          find build/ios/ipa -name "*.ipa" -maxdepth 1 || true

    artifacts:
      - build/ios/ipa/*.ipa
