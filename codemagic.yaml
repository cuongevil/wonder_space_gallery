workflows:
  ios_adhoc_final:
    name: WonderSpace iOS AdHoc
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      # -----------------------------------------------------
      # 1. FLUTTER CLEAN + PUB
      # -----------------------------------------------------
      - name: Clean Flutter
        script: |
          flutter clean
          flutter pub get

      # -----------------------------------------------------
      # 2. RESET ios/Flutter/*.xcconfig (NO ERRORS)
      # -----------------------------------------------------
      - name: Rebuild xcconfig
        script: |
          mkdir -p ios/Flutter

          echo '#include "Generated.xcconfig"' > ios/Flutter/Debug.xcconfig
          echo '#include "Generated.xcconfig"' > ios/Flutter/Release.xcconfig
          echo '#include "Generated.xcconfig"' > ios/Flutter/Profile.xcconfig

          echo '$(inherited)' >> ios/Flutter/Debug.xcconfig
          echo '$(inherited)' >> ios/Flutter/Release.xcconfig
          echo '$(inherited)' >> ios/Flutter/Profile.xcconfig

      # -----------------------------------------------------
      # 3. POD INSTALL (NO DEINTEGRATE)
      # -----------------------------------------------------
      - name: Install Pods
        script: |
          cd ios
          rm -rf Podfile.lock
          pod repo update
          pod install --verbose
          cd ..

      # -----------------------------------------------------
      # 4. Copy Flutter.framework đúng slice ARM64
      # -----------------------------------------------------
      - name: Ensure Flutter.framework (ARM64 ONLY)
        script: |
          flutter precache --ios

          ENGINE=$(find $HOME/programs/flutter/bin/cache/artifacts/engine -name ios-release -type d | head -1)

          echo "ENGINE PATH: $ENGINE"

          rm -rf ios/Flutter/Flutter.framework

          cp -R $ENGINE/Flutter.xcframework/ios-arm64/Flutter.framework ios/Flutter/

          ls ios/Flutter/Flutter.framework/Headers || exit 1

      # -----------------------------------------------------
      # 5. ADD FRAMEWORK SEARCH PATHS TRỰC TIẾP TRONG XCODE PROJECT
      # (Fix lỗi sqflite_darwin không tìm Flutter.h)
      # -----------------------------------------------------
      - name: Patch Runner.xcodeproj search paths
        script: |
          FILE="ios/Runner.xcodeproj/project.pbxproj"
          echo "Patching Runner.xcodeproj…"

          sed -i '' 's/FRAMEWORK_SEARCH_PATHS = (/FRAMEWORK_SEARCH_PATHS = (\n"$(PROJECT_DIR)\/Flutter",/g' $FILE

          sed -i '' 's/HEADER_SEARCH_PATHS = (/HEADER_SEARCH_PATHS = (\n"$(PROJECT_DIR)\/Flutter\/Flutter.framework\/Headers",/g' $FILE

      # -----------------------------------------------------
      # 6. BUILD FLUTTER (NO CODESIGN)
      # -----------------------------------------------------
      - name: Build Flutter iOS
        script: |
          flutter build ios --release --no-codesign -v

      # -----------------------------------------------------
      # 7. ARCHIVE
      # -----------------------------------------------------
      - name: Archive AdHoc IPA
        script: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES

      # -----------------------------------------------------
      # 8. EXPORT IPA
      # -----------------------------------------------------
      - name: Export IPA
        script: |
          cat > ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ctmd.wonderforge.wonderspace.gallery</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
