workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "WonderSpaceGallery_AppStore_Profile"

    scripts:
      - name: 🧹 Clean & Install Pods
        script: |
          set -e
          flutter clean
          flutter pub get
          cd ios
          pod repo update
          pod install
          cd ..

      - name: 🔨 Link Flutter headers (v10.0 full engine scan)
        script: |
          #!/usr/bin/env bash
          set -e
          echo "🔗 Linking Flutter.xcframework headers (auto full-scan engine v10.0)..."

          mkdir -p ios/Flutter
          FLUTTER_BIN=$(which flutter)
          ENGINE_BASE=$(dirname "$FLUTTER_BIN")/../bin/cache/artifacts/engine
          if [ ! -d "$ENGINE_BASE" ]; then
            ENGINE_BASE="/Users/builder/programs/flutter/bin/cache/artifacts/engine"
          fi

          echo "🔍 Searching engine base: $ENGINE_BASE"

          FRAMEWORK_PATH=$(find "$ENGINE_BASE" -type d -path "*/ios-release/*/Flutter.framework" -print -quit)
          if [ -z "$FRAMEWORK_PATH" ]; then
            FRAMEWORK_PATH=$(find "$ENGINE_BASE" -type d -path "*/ios/*/Flutter.framework" -print -quit)
          fi
          if [ -z "$FRAMEWORK_PATH" ]; then
            FRAMEWORK_PATH=$(find "$ENGINE_BASE" -type d -path "*/ios-profile/*/Flutter.framework" -print -quit)
          fi

          if [ -z "$FRAMEWORK_PATH" ]; then
            echo "❌ Could not locate Flutter.framework anywhere!"
            find "$ENGINE_BASE" -maxdepth 6 -type d -name "Flutter.framework" || true
            exit 1
          fi

          echo "✅ Found Flutter.framework at: $FRAMEWORK_PATH"
          cp -R "$FRAMEWORK_PATH" ios/Flutter/
          echo "✅ Copied Flutter.framework → ios/Flutter/"
          echo "📁 Headers check:"
          ls ios/Flutter/Flutter.framework/Headers || echo "⚠️ Headers missing!"

      - name: 🧩 Regenerate missing xcfilelists
        script: |
          set -e
          echo "🧩 Checking and regenerating missing xcfilelist files..."
          cd ios
          PODS_TARGET_DIR="Pods/Target Support Files/Pods-Runner"
          mkdir -p "$PODS_TARGET_DIR"

          echo "Pods/../Flutter/Flutter.framework" > "$PODS_TARGET_DIR/Pods-Runner-frameworks-Release-input-files.xcfilelist"
          echo "Pods/../build/Release-iphoneos/Pods_Runner.framework" > "$PODS_TARGET_DIR/Pods-Runner-frameworks-Release-output-files.xcfilelist"
          echo "Pods/../Resources/*" > "$PODS_TARGET_DIR/Pods-Runner-resources-Release-input-files.xcfilelist"
          echo "Pods/../build/Release-iphoneos/Resources/*" > "$PODS_TARGET_DIR/Pods-Runner-resources-Release-output-files.xcfilelist"

          echo "✅ xcfilelist regenerated successfully."
          cd ..

      - name: 🚀 Build iOS Archive (App Store)
        script: |
          set -e
          flutter build ios --release --no-codesign
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export signed IPA (App Store)
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_appstore.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA
        script: |
          echo "📂 IPA files:"
          find build/ios/ipa -type f -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa

