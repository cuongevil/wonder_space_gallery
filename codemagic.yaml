workflows:
  ios_adhoc_manual:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    cache:
      cache_paths: [] # ⚡ Disable cache để rebuild sạch

    scripts:
      - name: 🧹 Clean Flutter environment & rebuild configs
        script: |
          set -e
          echo "🧹 Cleaning Flutter + rebuilding configs..."
          flutter clean
          flutter pub get
          flutter precache --ios
          flutter build ios --no-codesign || true  # Tạo Generated.xcconfig
          rm -rf ~/Library/Developer/Xcode/DerivedData
          cd ios
          pod deintegrate || true
          pod repo update
          pod install
          cd ..
          echo "✅ Flutter + Pods ready."

      - name: 🧱 Rebuild Flutter engine for ios-release
        script: |
          set -e
          echo "🧱 Forcing Flutter engine rebuild (ios-release)..."
          flutter precache --ios --force
          flutter build ios --release --no-codesign || true
          echo "✅ ios-release engine rebuilt."

      - name: 🧩 Auto-detect & copy Flutter.framework (v11.1)
        script: |
          set -e
          echo "🧩 Auto-detecting Flutter.framework (ios-release arm64)..."

          # 1️⃣ Detect Flutter SDK location
          FLUTTER_BIN=$(which flutter)
          FLUTTER_ROOT=$(dirname "$FLUTTER_BIN")/..
          if [ ! -d "$FLUTTER_ROOT/bin/cache/artifacts/engine" ]; then
            FLUTTER_ROOT="/Users/builder/programs/flutter"
          fi
          ENGINE_DIR="$FLUTTER_ROOT/bin/cache/artifacts/engine"
          echo "🔍 Flutter SDK root: $FLUTTER_ROOT"

          # 2️⃣ Remove simulator/profile slices
          echo "🧹 Removing simulator/profile slices..."
          find "$ENGINE_DIR" -type d -path "*/ios-profile*" -exec rm -rf {} + || true
          find "$ENGINE_DIR" -type d -path "*/ios-simulator*" -exec rm -rf {} + || true

          # 3️⃣ Find ios-release arm64 slice
          DEVICE_SLICE=$(find "$ENGINE_DIR" -type d -path "*/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework" | head -n 1)

          if [ -z "$DEVICE_SLICE" ]; then
            echo "❌ Could not locate ios-arm64 slice!"
            echo "Available slices:"
            find "$ENGINE_DIR" -type d -name "Flutter.framework" | sed 's/^/   /'
            exit 1
          fi

          echo "✅ Found slice: $DEVICE_SLICE"
          mkdir -p ios/Flutter
          rm -rf ios/Flutter/Flutter.framework
          cp -R "$DEVICE_SLICE" ios/Flutter/
          echo "✅ Copied Flutter.framework (ios-release arm64)."

      - name: 🚀 Build iOS Archive (Ad Hoc)
        script: |
          set -e
          echo "🚀 Building iOS archive..."
          flutter build ios --release --no-codesign
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export signed IPA (Ad Hoc)
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA Path
        script: |
          echo "📂 IPA ready at:"
          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
