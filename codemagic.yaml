workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "WonderSpaceGallery_AppStore_Profile"

    scripts:
      - name: 🧹 Clean & Install Pods first
        script: |
          set -e
          echo "🧹 Cleaning Flutter build..."
          flutter clean
          flutter pub get
          flutter precache --ios

          echo "📦 Installing CocoaPods..."
          cd ios
          pod repo update
          pod install
          cd ..
          echo "✅ CocoaPods installed successfully."

      - name: 🔨 Flutter Prebuild (Generate Runner)
        script: |
          set -e
          echo "🔨 Building Flutter iOS Runner..."
          mkdir -p ios/Flutter

          FLUTTER_ENGINE_DIR=$(dirname $(which flutter))/../bin/cache/artifacts/engine/ios
          if [ -d "$FLUTTER_ENGINE_DIR/Flutter.framework" ]; then
            echo "✅ Found Flutter.framework, copying..."
            cp -R "$FLUTTER_ENGINE_DIR/Flutter.framework" ios/Flutter/
          else
            echo "⚠️ Flutter.framework not found, forcing precache..."
            flutter precache --ios
            cp -R "$FLUTTER_ENGINE_DIR/Flutter.framework" ios/Flutter/
          fi

          flutter build ios --release --no-codesign
          echo "✅ Flutter iOS build completed."

      - name: 🚀 Build iOS Archive
        script: |
          set -e
          echo "🚀 Running Xcode archive..."
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS,name=Any iOS Device' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            | tee build_log.txt | xcpretty

          echo "✅ Archive ready at build/ios/archive/Runner.xcarchive"

      - name: 📦 Export signed IPA (App Store)
        script: |
          set -e
          echo "📦 Exporting signed IPA with exportOptions_appstore.plist..."
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_appstore.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA files
        script: |
          echo "📂 IPA files:"
          find build/ios/ipa -type f -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa

  ios_adhoc_manual:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: 🧹 Clean & Install Pods
        script: |
          set -e
          flutter clean
          flutter pub get
          flutter precache --ios
          cd ios
          pod install
          cd ..

      - name: 🔨 Build Flutter iOS (no codesign)
        script: |
          set -e
          echo "🔨 Preparing Flutter.framework..."
          mkdir -p ios/Flutter

          FLUTTER_ENGINE_DIR=$(dirname $(which flutter))/../bin/cache/artifacts/engine/ios
          if [ -d "$FLUTTER_ENGINE_DIR/Flutter.framework" ]; then
            echo "✅ Found Flutter.framework, copying..."
            cp -R "$FLUTTER_ENGINE_DIR/Flutter.framework" ios/Flutter/
          else
            echo "⚠️ Flutter.framework not found, forcing precache..."
            flutter precache --ios
            cp -R "$FLUTTER_ENGINE_DIR/Flutter.framework" ios/Flutter/
          fi

          flutter build ios --release --no-codesign
          echo "✅ Flutter iOS build completed."

      - name: 🚀 Build iOS Archive (Ad Hoc)
        script: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export signed IPA (Ad Hoc)
        script: |
          set -e
          echo "📦 Exporting signed IPA with exportOptions_adhoc.plist..."
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa
          echo "✅ AdHoc IPA exported successfully."

      - name: 📋 Show IPA Path
        script: |
          echo "📂 IPA ready at:"
          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
