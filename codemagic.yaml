workflows:
  ios_adhoc_minimal:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: 🧩 Install GNU timeout & basic tools
        script: |
          brew install coreutils || true

      - name: 🧼 Clean Flutter & Prepare xcconfig
        script: |
          set -e
          flutter clean
          flutter pub get
          mkdir -p ios/Flutter
          for cfg in Release Debug Profile; do
            if [ ! -f "ios/Flutter/$cfg.xcconfig" ]; then
              echo "// Auto-created on Codemagic" > ios/Flutter/$cfg.xcconfig
            fi
          done
          echo "✅ Ensured ios/Flutter/*.xcconfig exists."

      - name: 📦 Install CocoaPods
        script: |
          set -e
          cd ios
          pod repo update
          pod install
          cd ..
          echo "✅ Pods installed successfully."

      - name: 🧾 Rebuild missing Pods filelists
        script: |
          set -e
          echo "🧾 Regenerating Pods support files..."
          cd ios
          if [ -d "Pods" ]; then
            rm -rf Pods/Target\ Support\ Files/Pods-Runner/*.xcfilelist || true
            pod install
          fi
          cd ..

      - name: 🚀 Build Flutter iOS (no codesign)
        script: |
          set -e
          flutter build ios --release --no-codesign

      - name: 📦 Create exportOptions (Ad Hoc)
        script: |
          set -e
          cat > ios/exportOptions_adhoc.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ctmd.wonderforge.wonderspace.gallery</key>
              <string>wonderspace_gallery_adhoc</string>
            </dict>
            <key>teamID</key>
            <string>CS2UV6F3ZY</string>
            <key>compileBitcode</key>
            <false/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

      - name: 🏗️ Archive iOS (manual signing)
        script: |
          set -e
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export signed IPA
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully!"
          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
