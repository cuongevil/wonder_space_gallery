workflows:
  ios_adhoc_manual:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: 🧼 Clean DerivedData & Flutter Cache
        script: |
          set -e
          echo "🧼 Cleaning DerivedData and Flutter cache..."
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ios/Flutter/Flutter.framework
          flutter clean
          flutter pub get
          flutter precache --ios --force

      - name: 🧱 Ensure Flutter xcconfig files exist
        script: |
          set -e
          echo "🧱 Ensuring Flutter iOS xcconfig files..."
          mkdir -p ios/Flutter
          for cfg in Release Debug Profile; do
            if [ ! -f "ios/Flutter/$cfg.xcconfig" ]; then
              echo "// Auto-created by Codemagic to avoid missing base configuration" > ios/Flutter/$cfg.xcconfig
              echo "Created ios/Flutter/$cfg.xcconfig"
            else
              echo "✅ ios/Flutter/$cfg.xcconfig already exists."
            fi
          done

      - name: 📦 Install CocoaPods
        script: |
          set -e
          echo "📦 Reinstalling CocoaPods..."
          cd ios
          rm -rf Pods Podfile.lock
          pod deintegrate
          pod cache clean --all
          pod repo update
          pod install
          cd ..
          echo "✅ Pods installed successfully."

      - name: 🧱 Force Rebuild Flutter.framework Slice
        script: |
          set -e
          echo "🧱 Force rebuilding Flutter.framework slice (ios-arm64)..."
          flutter precache --ios --force
          ENGINE_DIR=$(find "$HOME/programs/flutter/bin/cache/artifacts/engine" -type d -name ios-release -print -quit)
          if [ -z "$ENGINE_DIR" ]; then
            echo "❌ No ios-release engine found!"
            find "$HOME/programs/flutter/bin/cache/artifacts/engine" -maxdepth 3 -type d
            exit 1
          fi
          echo "✅ Using engine from: $ENGINE_DIR"
          mkdir -p ios/Flutter
          rm -rf ios/Flutter/Flutter.framework
          cp -R "$ENGINE_DIR/Flutter.xcframework/ios-arm64/Flutter.framework" ios/Flutter/
          echo "✅ Copied ios-release Flutter.framework manually."
          ls ios/Flutter/Flutter.framework/Headers || (echo "❌ Headers missing!" && exit 1)

      - name: 🧩 Ensure Flutter.framework Search Path
        script: |
          set -e
          echo "🧩 Ensuring Xcode project knows where Flutter.framework is..."
          PLIST="ios/Runner.xcodeproj/project.pbxproj"
          if ! grep -q '$(PROJECT_DIR)/Flutter' "$PLIST"; then
            echo "⚙️ Adding Flutter.framework path to FRAMEWORK_SEARCH_PATHS..."
            sed -i '' 's/FRAMEWORK_SEARCH_PATHS = (/FRAMEWORK_SEARCH_PATHS = (\n\t\t\t"$(PROJECT_DIR)\/Flutter",/' "$PLIST"
          else
            echo "✅ Flutter.framework path already set."
          fi

      - name: 🧱 Build Flutter iOS (Release No-Codesign)
        script: |
          set -e
          echo "🚀 Building Flutter iOS..."
          echo "📁 Checking Flutter.framework before build:"
          ls -la ios/Flutter || true
          ls -la ios/Flutter/Flutter.framework || true
          ls -la ios/Flutter/Flutter.framework/Headers || true

          flutter build ios --release --no-codesign

      - name: 🚀 Build iOS Archive (Ad Hoc)
        script: |
          set -e
          mkdir -p build/ios/archive
          echo "🚀 Archiving iOS build..."
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export Signed IPA
        script: |
          set -e
          echo "📦 Exporting signed IPA..."
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully!"
          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
