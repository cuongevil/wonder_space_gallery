workflows:
  ios_adhoc_final:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: Clean Flutter
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: Reset Pods
        script: |
          set -e
          cd ios
          pod deintegrate || true
          rm -rf Pods Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: Ensure Flutter.framework
        script: |
          set -e
          flutter precache --ios

          ENGINE=$(find "$HOME/programs/flutter/bin/cache/artifacts/engine" -name ios-release -type d | head -1)
          echo "ENGINE = $ENGINE"

          mkdir -p ios/Flutter
          rm -rf ios/Flutter/Flutter.framework

          if [ -d "$ENGINE/Flutter.xcframework/ios-arm64/Flutter.framework" ]; then
            cp -R "$ENGINE/Flutter.xcframework/ios-arm64/Flutter.framework" ios/Flutter/
          else
            cp -R "$ENGINE/Flutter.xcframework/ios-arm64_armv7/Flutter.framework" ios/Flutter/
          fi

      - name: Build Flutter iOS
        script: |
          echo "🚀 Building Flutter iOS..."
          set +e
          flutter build ios --release --no-codesign -v | tee flutter_build.log
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "====== LAST 80 LINES ======"
          tail -n 80 flutter_build.log || true

          echo "====== ERROR LINES ======"
          grep -R "error:" -n flutter_build.log | tail -n 50 || true

          if [ $STATUS -ne 0 ]; then
            echo "❌ Flutter build failed"
            exit $STATUS
          fi

      - name: Archive IPA
        script: |
          set -e
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}"

      - name: Export IPA
        script: |
          set -e
          cat > ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ctmd.wonderforge.wonderspace.gallery</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
