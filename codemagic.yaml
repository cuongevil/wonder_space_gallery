workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROVISIONING_PROFILE_SPECIFIER: "WonderSpaceGallery_AppStore_Profile"
        FLUTTER_BUILD_NUMBER: "11"

    scripts:
      - name: 🧹 Clean & Prepare
        script: |
          set -e
          echo "🧹 Cleaning Flutter project..."
          flutter clean
          flutter pub get

      - name: 🔢 Sync version from pubspec.yaml to Info.plist
        script: |
          set -e
          VERSION_LINE=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION_LINE | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION_LINE | cut -d'+' -f2)
          echo "📦 Version: $VERSION_NAME+$VERSION_CODE"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION_CODE" ios/Runner/Info.plist
          echo "✅ Info.plist synced."

      - name: 🧩 Fix Podfile (Clean Pods + Disable Code Signing for Frameworks)
        script: |
          set -e
          cd ios
          echo "🧩 Cleaning old Pods and DerivedData..."
          rm -rf Pods Podfile.lock ~/Library/Developer/Xcode/DerivedData

          echo "📱 Rewriting Podfile..."
          cat > Podfile <<'RUBY'
          platform :ios, '15.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            raise "#{generated_xcode_build_settings_path} must exist. Run flutter pub get first." unless File.exist?(generated_xcode_build_settings_path)
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)

              # 🔹 Disable code signing for all Pods
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
                config.build_settings['DEVELOPMENT_TEAM'] = ''
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                config.build_settings.delete('PRODUCT_BUNDLE_IDENTIFIER')
              end
            end

            # 🔹 Manual signing only for Runner
            installer.aggregate_targets.each do |aggregate_target|
              aggregate_target.user_project.native_targets.each do |target|
                next unless target.name == 'Runner'
                target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
                  config.build_settings['DEVELOPMENT_TEAM'] = 'CS2UV6F3ZY'
                  config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)'
                  config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'WonderSpaceGallery_AppStore_Profile'
                end
              end
            end
          end
          RUBY

          echo "📦 Installing fresh Pods..."
          pod repo update
          pod install
          cd ..

      - name: 🚀 Build & Archive
        script: |
          set -e
          echo "🚀 Starting Xcode archive..."
          mkdir -p build/ios/archive

          # ✅ Không override signing từ CLI — dùng config trong Podfile
          xcodebuild clean -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates

      - name: 📦 Export Signed IPA
        script: |
          set -e
          EXPORT_PATH="build/ios/ipa"
          ARCHIVE_PATH="build/ios/archive/Runner.xcarchive"
          EXPORT_OPTIONS="build/ios/exportOptions.plist"

          echo "🧾 Creating exportOptions.plist..."
          cat > $EXPORT_OPTIONS <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_SPECIFIER</string>
            </dict>
            <key>destination</key>
            <string>export</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          echo "📦 Exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO

          echo "✅ Export completed."

          IPA_PATH=$(find "$EXPORT_PATH" -type f -name "*.ipa" | head -n 1 || true)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ IPA not found! Debug list:"
            ls -R "$EXPORT_PATH"
            exit 1
          fi

          cp "$IPA_PATH" build/Runner.ipa
          echo "✅ Copied IPA to build/Runner.ipa"

    artifacts:
      - build/Runner.ipa
      - build/ios/archive/Runner.xcarchive
      - build/ios/exportOptions.plist
