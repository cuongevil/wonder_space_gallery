workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROVISIONING_PROFILE_SPECIFIER: "WonderSpaceGallery_AppStore_Profile"
        FLUTTER_BUILD_NUMBER: "5"

    scripts:
      - name: 🧹 Clean & Prepare
        script: |
          set -e
          echo "🧹 Cleaning Flutter build..."
          flutter clean
          flutter pub get

      - name: 🔢 Sync version from pubspec.yaml to Info.plist
        script: |
          set -e
          VERSION_LINE=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION_LINE | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION_LINE | cut -d'+' -f2)
          echo "📦 Version: $VERSION_NAME+$VERSION_CODE"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION_CODE" ios/Runner/Info.plist
          echo "✅ Info.plist synced."

      - name: 🧩 Fix Podfile (final version)
        script: |
          set -e
          cd ios
          echo "📱 Rewriting Podfile with final signing logic..."
          cat > Podfile <<'RUBY'
          platform :ios, '15.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            raise "#{generated_xcode_build_settings_path} must exist. Run flutter pub get first." unless File.exist?(generated_xcode_build_settings_path)
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end

          post_install do |installer|
            # 🔧 Disable signing for all Pods (fix ITMS-90685)
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
                config.build_settings['DEVELOPMENT_TEAM'] = ''
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                config.build_settings.delete('PRODUCT_BUNDLE_IDENTIFIER')
                config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ''
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              end
            end

            # 🧩 Ensure Pods project-level config is also cleaned
            installer.pods_project.build_configurations.each do |config|
              config.build_settings.delete('PRODUCT_BUNDLE_IDENTIFIER')
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ''
            end

            # ✅ Manual signing only for Runner target
            installer.aggregate_targets.each do |aggregate_target|
              aggregate_target.user_project.native_targets.each do |target|
                next unless target.name == 'Runner'
                target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
                  config.build_settings['DEVELOPMENT_TEAM'] = 'CS2UV6F3ZY'
                  config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)'
                  config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'WonderSpaceGallery_AppStore_Profile'
                  config.build_settings['ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES'] = 'NO'
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                end
              end
            end
          end
          RUBY

          echo "📦 Installing pods..."
          pod repo update
          pod deintegrate
          pod install
          cd ..

      - name: 🚀 Build & Archive iOS App
        script: |
          set -e
          echo "--------------------------------------------"
          echo "Team ID: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Cert Name: $CERT_NAME"
          echo "Provisioning Profile: $PROVISIONING_PROFILE_SPECIFIER"
          echo "Build Number: $FLUTTER_BUILD_NUMBER"
          echo "--------------------------------------------"

          mkdir -p build/ios/archive
          set -o pipefail

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            DEVELOPMENT_TEAM=$TEAM_ID \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID \
            FLUTTER_BUILD_NUMBER=$FLUTTER_BUILD_NUMBER \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CERT_NAME" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            -allowProvisioningUpdates | tee build/archive.log

          echo "✅ Archive completed and properly signed."

      - name: 🔍 Detect Bundle ID Collisions
        script: |
          echo "🔎 Scanning for duplicate CFBundleIdentifiers..."
          find build/ios/archive/Runner.xcarchive -name "Info.plist" -exec grep -H "CFBundleIdentifier" {} \; | sort | uniq -c | sort -nr

      - name: 📦 Export Clean IPA
        script: |
          set -e
          echo "🧹 Removing disallowed Swift dylibs..."
          find build/ios/archive/Runner.xcarchive -name "libswift_*.dylib" -print -delete
          echo "✅ Cleaned Swift dylibs."

          echo "🧩 Creating IPA..."
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Runner.ipa Payload
          cd ../../..
          echo "✅ IPA ready at build/ios/ipa/Runner.ipa"

          echo "🧾 Checking for embedded.mobileprovision..."
          unzip -l build/ios/ipa/Runner.ipa | grep mobileprovision || echo "⚠️ WARNING: missing embedded.mobileprovision (check signing)."

    artifacts:
      - build/ios/ipa/Runner.ipa
      - build/ios/archive/Runner.xcarchive
      - build/archive.log
