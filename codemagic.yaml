workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROVISIONING_PROFILE_SPECIFIER: "WonderSpaceGallery_AppStore_Profile"

    scripts:
      - name: 🧹 Clean & Prepare
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: 🚀 Build iOS release
        script: |
          set -e
          echo "🚀 Building iOS release for App Store..."
          flutter build ipa --release --export-method app-store
          echo "✅ Flutter build completed."
          echo "📦 IPA files:"
          find build/ios/ipa -type f -name "*.ipa"

      - name: 🔍 Unzip and sanitize CFBundleIdentifiers
        script: |
          set -e
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          WORK_DIR="build/tmp_ipa"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q "$IPA_PATH" -d "$WORK_DIR"
          
          APP_PATH=$(find "$WORK_DIR" -type d -name "Runner.app" | head -n 1)
          echo "📁 App path: $APP_PATH"

          echo "🔧 Fixing underscores in frameworks CFBundleIdentifier..."
          find "$APP_PATH/Frameworks" -name Info.plist | while read plist; do
            CURRENT_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$plist" 2>/dev/null || true)
            if [[ "$CURRENT_ID" == *"_"* ]]; then
              FIXED_ID=$(echo "$CURRENT_ID" | sed 's/_/-/g')
              echo "⚙️ $CURRENT_ID → $FIXED_ID"
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $FIXED_ID" "$plist" || true
            fi
          done

      - name: 🔐 Re-sign app and frameworks manually
        script: |
          set -e
          APP_PATH=$(find build/tmp_ipa -type d -name "Runner.app" | head -n 1)
          echo "🔐 Re-signing app and frameworks..."
          find "$APP_PATH/Frameworks" -type d -name "*.framework" | while read framework; do
            INFO_PLIST="$framework/Info.plist"
            FRAMEWORK_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$INFO_PLIST" 2>/dev/null || echo "")
            if [ -n "$FRAMEWORK_ID" ]; then
              echo "Re-signing: $(basename "$framework") with id $FRAMEWORK_ID"
              codesign --remove-signature "$framework" || true
              codesign -f -s "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)" --identifier "$FRAMEWORK_ID" --timestamp=none "$framework"
            fi
          done

          echo "🔑 Re-sign main Runner.app"
          codesign -f -s "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)" \
            --entitlements ios/Runner/Runner.entitlements "$APP_PATH" --timestamp=none

      - name: 📦 Repack fixed IPA
        script: |
          set -e
          cd build/tmp_ipa
          zip -qry "../Runner_fixed.ipa" Payload
          cd ../..
          echo "✅ Fixed IPA generated: build/Runner_fixed.ipa"

    artifacts:
      - build/Runner_fixed.ipa
