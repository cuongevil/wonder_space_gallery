workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "WonderSpaceGallery_AppStore_Profile"

    scripts:
      - name: 🧹 Clean & Install Pods
        script: |
          set -e
          echo "🧹 Cleaning Flutter build..."
          flutter clean
          flutter pub get
          flutter precache --ios
          cd ios
          pod repo update
          pod install
          cd ..
          echo "✅ CocoaPods installed successfully."

      - name: 🔨 Build Flutter iOS (no codesign)
        script: |
          set -e
          echo "🔨 Detecting Flutter.framework..."
          mkdir -p ios/Flutter

          # Resolve actual Flutter SDK path (handle Codemagic symlink)
          FLUTTER_BIN_PATH=$(readlink -f "$(which flutter)" || which flutter)
          FLUTTER_SDK_ROOT=$(dirname $(dirname "$FLUTTER_BIN_PATH"))

          # Try to locate Flutter.framework
          FLUTTER_FRAMEWORK_PATH=$(find "${FLUTTER_SDK_ROOT}/bin/cache/artifacts/engine" -name "Flutter.framework" -type d 2>/dev/null | head -n 1)

          # If not found, force precache
          if [ -z "$FLUTTER_FRAMEWORK_PATH" ]; then
            echo "⚠️ Flutter.framework not found, running flutter precache..."
            flutter precache --ios
            FLUTTER_FRAMEWORK_PATH=$(find "${FLUTTER_SDK_ROOT}/bin/cache/artifacts/engine" -name "Flutter.framework" -type d 2>/dev/null | head -n 1)
          fi

          # Verify and copy
          if [ -n "$FLUTTER_FRAMEWORK_PATH" ]; then
            echo "✅ Found Flutter.framework at: $FLUTTER_FRAMEWORK_PATH"
            cp -R "$FLUTTER_FRAMEWORK_PATH" ios/Flutter/
          else
            echo "❌ Could not locate Flutter.framework after precache!"
            echo "🔍 Dumping Flutter engine contents for debugging:"
            ls -R "${FLUTTER_SDK_ROOT}/bin/cache/artifacts/engine" || true
            exit 1
          fi

          echo "📦 Building Flutter iOS app (no codesign)..."
          flutter build ios --release --no-codesign
          echo "✅ Flutter iOS build completed successfully."

      - name: 🚀 Build iOS Archive (App Store)
        script: |
          set -e
          echo "🚀 Running Xcode archive..."
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export signed IPA (App Store)
        script: |
          set -e
          echo "📦 Exporting signed IPA with exportOptions_appstore.plist..."
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_appstore.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA files
        script: |
          echo "📂 IPA files:"
          find build/ios/ipa -type f -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa

