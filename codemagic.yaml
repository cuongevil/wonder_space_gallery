workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "WonderSpaceGallery_AppStore_Profile"

    scripts:
      - name: 🧹 Clean & Prepare Environment
        script: |
          set -e
          echo "🧹 Cleaning Flutter and Pods..."
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/Runner.xcworkspace
          rm -rf ~/Library/Developer/Xcode/DerivedData
          flutter pub get
          cd ios
          pod repo update
          pod install
          cd ..
          echo "✅ Environment ready."

      - name: 🔄 Reset signing deeply
        script: |
          set -e
          echo "🔄 Resetting all signing settings recursively..."

          # 1️⃣ Xóa các dòng CODE_SIGN, PROVISIONING_PROFILE_SPECIFIER, DEVELOPMENT_TEAM
          find ios -name "project.pbxproj" -print0 | while IFS= read -r -d '' file; do
            echo "🧹 Cleaning signing info in $file ..."
            sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' "$file" || true
            sed -i '' '/CODE_SIGN_IDENTITY/d' "$file" || true
            sed -i '' '/DEVELOPMENT_TEAM/d' "$file" || true
            sed -i '' '/CODE_SIGN_STYLE/d' "$file" || true
          done

          # 2️⃣ Force set Pods.xcodeproj sang Automatic
          if [ -f "ios/Pods/Pods.xcodeproj/project.pbxproj" ]; then
            echo "⚙️ Forcing Pods.xcodeproj to Automatic signing..."
            sed -i '' 's/ProvisioningStyle = Manual/ProvisioningStyle = Automatic/g' ios/Pods/Pods.xcodeproj/project.pbxproj || true
          fi

          # 3️⃣ Kiểm tra lại sau khi xoá
          echo "🔍 Checking if any PROVISIONING_PROFILE_SPECIFIER remains..."
          grep -r "PROVISIONING_PROFILE_SPECIFIER" ios || echo "✅ No provisioning profile lines remain."

          echo "✅ Deep signing reset completed."

      - name: 🧾 Create exportOptions.plist
        script: |
          set -e
          mkdir -p build/ios
          cat > build/ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          echo "✅ exportOptions.plist created."

      - name: 🚀 Build iOS Release (Archive)
        script: |
          set -e
          echo "🚀 Archiving iOS app via Xcode..."
          mkdir -p build/ios/archive
          xcodebuild clean -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release | xcpretty

          xcodebuild archive -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            ONLY_ACTIVE_ARCH=NO \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            OTHER_CODE_SIGN_FLAGS="--deep --force" \
            | tee build_log.txt | xcpretty
  

  if [ ! -d "build/ios/archive/Runner.xcarchive" ]; then
            echo "❌ Archive failed! Showing last 50 lines of Xcode log:"
            tail -n 50 build_log.txt
            exit 1
          fi
          echo "✅ Archive succeeded."

      - name: 📦 Export IPA
        script: |
          set -e
          echo "📦 Exporting signed IPA..."
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist build/ios/exportOptions.plist \
            -exportPath build/ios/ipa \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES | xcpretty
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA
        script: |
          echo "📂 Generated IPA files:"
          find build/ios/ipa -type f -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
