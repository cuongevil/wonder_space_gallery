workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: $TEAM_ID
        BUNDLE_ID: $BUNDLE_ID
        CERT_NAME: $CERT_NAME
        PROVISIONING_PROFILE_SPECIFIER: $PROFILE_NAME

    scripts:
      - name: 🧹 Clean & Prepare
        script: |
          set -e
          echo "🧹 Cleaning Flutter project..."
          flutter clean
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: 🧾 Create exportOptions.plist
        script: |
          set -e
          echo "🧾 Creating exportOptions.plist..."
          mkdir -p build/ios     # ✅ fix lỗi: tạo thư mục trước
          cat > build/ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          echo "✅ exportOptions.plist created at build/ios/exportOptions.plist"

      - name: 🚀 Build iOS Release (Xcode)
        script: |
          set -e
          echo "🚀 Archiving app..."
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -archivePath build/ios/archive/Runner.xcarchive \
            -configuration Release \
            DEVELOPMENT_TEAM=$TEAM_ID \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$CERT_NAME" \
            clean archive

          echo "📦 Exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist build/ios/exportOptions.plist \
            -exportPath build/ios/ipa

          echo "✅ IPA successfully generated in build/ios/ipa"

      - name: 📋 Show IPA
        script: |
          echo "📂 IPA files:"
          find build/ios/ipa -type f -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
