workflows:
  ios_adhoc_manual:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: 🧩 Setup GNU utils
        script: |
          echo "🧩 Checking gtimeout availability..."
          if ! command -v gtimeout >/dev/null 2>&1; then
            echo "🧩 Installing GNU coreutils (adds gtimeout)..."
            brew install coreutils || echo "⚠️ Brew failed, will build without timeout."
          else
            echo "✅ gtimeout already installed."
          fi

      - name: 🧼 Clean DerivedData & Flutter Cache
        script: |
          set -e
          echo "🧼 Cleaning DerivedData and Flutter cache..."
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ios/Flutter/Flutter.framework
          flutter clean
          flutter pub get
          flutter precache --ios --force

      - name: 🧱 Ensure Flutter xcconfig files exist
        script: |
          set -e
          echo "🧱 Ensuring Flutter iOS xcconfig files..."
          mkdir -p ios/Flutter
          for cfg in Release Debug Profile; do
            if [ ! -f "ios/Flutter/$cfg.xcconfig" ]; then
              echo "// Auto-created by Codemagic to avoid missing base configuration" > ios/Flutter/$cfg.xcconfig
              echo "Created ios/Flutter/$cfg.xcconfig"
            else
              echo "✅ ios/Flutter/$cfg.xcconfig already exists."
            fi
          done

      - name: 🧾 Ensure AppFrameworkInfo.plist exists
        script: |
          set -e
          echo "🧾 Ensuring ios/Flutter/AppFrameworkInfo.plist..."
          mkdir -p ios/Flutter
          cat > ios/Flutter/AppFrameworkInfo.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>App</string>
            <key>CFBundleIdentifier</key>
            <string>io.flutter.flutter.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>App</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
          </dict>
          </plist>
          EOF
          echo "✅ Created ios/Flutter/AppFrameworkInfo.plist"

      - name: 📦 Install CocoaPods
        script: |
          set -e
          echo "📦 Reinstalling CocoaPods..."
          cd ios
          rm -rf Pods Podfile.lock
          pod deintegrate
          pod cache clean --all
          pod repo update
          pod install
          cd ..
          echo "✅ Pods installed successfully."

      - name: 🧱 Force Rebuild Flutter.framework Slice
        script: |
          set -e
          echo "🧱 Force rebuilding Flutter.framework slice (auto detect arm64_armv7)..."
          flutter precache --ios --force
          flutter --version
          
          ENGINE_DIR=$(find "$HOME/programs/flutter/bin/cache/artifacts/engine" -type d -name ios-release -print -quit)
          if [ -z "$ENGINE_DIR" ]; then
            echo "❌ No ios-release engine found!"
            find "$HOME/programs/flutter/bin/cache/artifacts/engine" -maxdepth 3 -type d
            exit 1
          fi

          echo "✅ Engine dir: $ENGINE_DIR"
          mkdir -p ios/Flutter
          rm -rf ios/Flutter/Flutter.framework

          SLICE_PATH=""
          if [ -d "$ENGINE_DIR/Flutter.xcframework/ios-arm64_armv7/Flutter.framework" ]; then
            SLICE_PATH="$ENGINE_DIR/Flutter.xcframework/ios-arm64_armv7/Flutter.framework"
          elif [ -d "$ENGINE_DIR/Flutter.xcframework/ios-arm64/Flutter.framework" ]; then
            SLICE_PATH="$ENGINE_DIR/Flutter.xcframework/ios-arm64/Flutter.framework"
          fi

          if [ -z "$SLICE_PATH" ]; then
            echo "❌ Could not find Flutter.framework slice!"
            find "$ENGINE_DIR" -name "Flutter.framework"
            exit 1
          fi

          cp -R "$SLICE_PATH" ios/Flutter/
          echo "✅ Copied Flutter.framework from: $SLICE_PATH"
          ls ios/Flutter/Flutter.framework/Headers || (echo "❌ Headers missing!" && exit 1)

      - name: 🩺 Verify Flutter.framework before build
        script: |
          set -e
          echo "📋 Verifying Flutter.framework integrity..."
          if [ ! -d "ios/Flutter/Flutter.framework" ]; then
            echo "❌ Flutter.framework missing before build!"
            exit 1
          fi
          ls ios/Flutter/Flutter.framework/Headers || {
            echo "❌ Flutter.framework headers missing!"
            exit 1
          }
          echo "✅ Flutter.framework ready to build."

      - name: 🧱 Build Flutter iOS (Release No-Codesign)
        script: |
          set -e
          echo "🚀 Building Flutter iOS (verbose mode, 40min timeout)..."

          if command -v gtimeout >/dev/null 2>&1; then
            echo "⏱ Using gtimeout (2400s = 40min)..."
            gtimeout 2400 flutter build ios --release --no-codesign -v || {
              echo "❌ Flutter build timeout — possible stuck during linking or Swift compile."
              echo "📄 Dumping last 100 lines of flutter build logs..."
              tail -n 100 ~/Library/Logs/flutter_*.log || true
              exit 1
            }
          else
            echo "⚠️ gtimeout not found — running without timeout."
            flutter build ios --release --no-codesign -v
          fi

          echo "✅ Flutter build completed."

      - name: 🚀 Build iOS Archive (Ad Hoc)
        script: |
          set -e
          echo "📦 Archiving iOS build (30min timeout)..."

          if command -v gtimeout >/dev/null 2>&1; then
            gtimeout 1800 xcodebuild archive \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath build/ios/archive/Runner.xcarchive \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="${TEAM_ID}" \
              CODE_SIGN_IDENTITY="${CERT_NAME}" \
              PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=YES || {
                echo "❌ xcodebuild archive timeout — stuck or signing issue."
                exit 1
              }
          else
            echo "⚠️ gtimeout not found — running xcodebuild without timeout."
            xcodebuild archive \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath build/ios/archive/Runner.xcarchive \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="${TEAM_ID}" \
              CODE_SIGN_IDENTITY="${CERT_NAME}" \
              PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=YES
          fi

      - name: 📦 Export Signed IPA
        script: |
          set -e
          echo "📦 Exporting signed IPA..."
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully!"
          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
