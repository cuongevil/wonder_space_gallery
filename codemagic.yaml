workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "WonderSpaceGallery_AppStore_Profile"

    scripts:
      - name: 🧹 Clean & Install Pods first
        script: |
          set -e
          echo "🧹 Cleaning Flutter build..."
          flutter clean
          flutter pub get
          flutter precache --ios

          echo "📦 Installing CocoaPods..."
          cd ios
          pod repo update
          pod install
          cd ..
          echo "✅ CocoaPods installed successfully."

      - name: 🔨 Flutter Prebuild (Generate Runner)
        script: |
          set -e
          echo "🔨 Building Flutter iOS Runner..."

          # 🩹 FIX: Ensure Flutter.framework exists and linked before build
          mkdir -p ios/Flutter
          FLUTTER_ENGINE_DIR=$(dirname $(which flutter))/../bin/cache/artifacts/engine/ios
          if [ -d "$FLUTTER_ENGINE_DIR/Flutter.framework" ]; then
            echo "🔗 Copying Flutter.framework manually..."
            cp -R "$FLUTTER_ENGINE_DIR/Flutter.framework" ios/Flutter/
          else
            echo "⚠️ Flutter.framework not found in cache; forcing precache..."
            flutter precache --ios
            cp -R "$FLUTTER_ENGINE_DIR/Flutter.framework" ios/Flutter/
          fi

          echo "📚 Verifying Flutter.framework headers..."
          ls ios/Flutter/Flutter.framework/Headers || echo "❌ Headers missing!"

          # 🔨 Build Flutter iOS app without signing
          flutter build ios --release --no-codesign
          echo "✅ Flutter iOS build completed."

      - name: 🧾 Create exportOptions.plist
        script: |
          set -e
          mkdir -p build/ios
          cat > build/ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key>
            <string>export</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "✅ exportOptions.plist created."

      - name: 🚀 Build iOS Archive
        script: |
          set -e
          echo "🚀 Running Xcode archive..."
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS,name=Any iOS Device' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            | tee build_log.txt | xcpretty

          if [ ! -d "build/ios/archive/Runner.xcarchive" ]; then
            echo "⚠️ Archive not found in build/ios/archive — checking fallback..."
            LATEST_ARCHIVE=$(ls -dt ~/Library/Developer/Xcode/Archives/*/*Runner.xcarchive 2>/dev/null | head -n 1)
            if [ -n "$LATEST_ARCHIVE" ]; then
              echo "📦 Found fallback archive: $LATEST_ARCHIVE"
              mkdir -p build/ios/archive
              cp -R "$LATEST_ARCHIVE" build/ios/archive/Runner.xcarchive
            else
              echo "❌ No archive found anywhere!"
              exit 65
            fi
          fi
          echo "✅ Archive ready at build/ios/archive/Runner.xcarchive"

      - name: 📦 Export signed IPA
        script: |
          set -e
          echo "📦 Exporting signed IPA..."
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist build/ios/exportOptions.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA
        script: |
          echo "📂 IPA files:"
          find build/ios/ipa -type f -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
