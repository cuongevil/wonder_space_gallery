workflows:
  ios_adhoc_manual:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: 🧹 Clean environment
        script: |
          set -e
          flutter clean
          rm -rf ios/Flutter/Flutter.framework ios/Flutter/Flutter.podspec
          flutter pub get

      - name: 🧩 Ensure Flutter.xcframework exists
        script: |
          set -e
          echo "🔍 Checking Flutter.xcframework..."
          ENGINE_DIR=$(dirname $(which flutter))/../bin/cache/artifacts/engine
          if [ ! -d "$ENGINE_DIR/Flutter.xcframework" ]; then
            echo "⚙️ Missing Flutter.xcframework — running full precache..."
            flutter precache --ios --universal
          fi
          echo "✅ Flutter.xcframework ready at: $ENGINE_DIR/Flutter.xcframework"

      - name: 🔨 Link Flutter headers manually
        script: |
          set -e
          echo "🔗 Linking Flutter.xcframework headers..."
          mkdir -p ios/Flutter
          ENGINE_DIR=$(dirname $(which flutter))/../bin/cache/artifacts/engine
          FRAMEWORK_PATH="$ENGINE_DIR/Flutter.xcframework/ios-arm64/Flutter.framework"
          if [ -d "$FRAMEWORK_PATH" ]; then
            cp -R "$FRAMEWORK_PATH" ios/Flutter/
            echo "✅ Copied Flutter.framework to ios/Flutter/"
          else
            echo "❌ Missing Flutter.framework inside xcframework!"
            exit 1
          fi
          echo "📁 Headers:"
          ls ios/Flutter/Flutter.framework/Headers || echo "⚠️ Headers not found"

      - name: 🧾 Install Pods
        script: |
          set -e
          cd ios
          pod repo update
          pod install
          cd ..

      - name: 🚀 Build iOS Archive
        script: |
          set -e
          echo "🚀 Building Flutter iOS release (no codesign)..."
          flutter build ios --release --no-codesign

          echo "📦 Running Xcode archive..."
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export signed IPA
        script: |
          set -e
          echo "📦 Exporting signed IPA..."
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA Path
        script: |
          echo "📂 IPA ready at:"
          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
