workflows:
  ios_adhoc_manual:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: 🧹 Clean & Prepare
        script: |
          set -e
          flutter clean
          flutter pub get
          flutter precache --ios
          mkdir -p ios/Flutter
          for cfg in Release Debug Profile; do
            touch ios/Flutter/$cfg.xcconfig
          done

      - name: 📦 Install CocoaPods
        script: |
          set -e
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: 🧱 Fix Flutter.framework (v11.5 definitive)
        script: |
          set -e
          echo "🧱 Preparing Flutter.framework for iOS device..."
          FLUTTER_BIN=$(which flutter)
          FLUTTER_ROOT=$(dirname "$FLUTTER_BIN")/..
          ENGINE_DIR="$FLUTTER_ROOT/bin/cache/artifacts/engine"

          echo "🔍 Searching Flutter.framework slice (ios-release / arm64)..."
          DEVICE_SLICE=$(find "$ENGINE_DIR" -type d -path "*/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework" | head -n 1)
          if [ -z "$DEVICE_SLICE" ]; then
            echo "⚠️ Using ios-profile fallback..."
            DEVICE_SLICE=$(find "$ENGINE_DIR" -type d -path "*/ios-profile/Flutter.xcframework/ios-arm64/Flutter.framework" | head -n 1)
          fi
          if [ -z "$DEVICE_SLICE" ]; then
            echo "❌ Flutter.framework not found!"
            find "$ENGINE_DIR" -name "Flutter.framework"
            exit 1
          fi

          mkdir -p ios/Flutter
          rm -rf ios/Flutter/Flutter.framework
          cp -R "$DEVICE_SLICE" ios/Flutter/
          echo "✅ Copied Flutter.framework from:"
          echo "$DEVICE_SLICE"

      - name: 🧱 Build Flutter iOS (Release No-Codesign)
        script: |
          set -e
          flutter build ios --release --no-codesign

      - name: 🚀 Build iOS Archive (Ad Hoc)
        script: |
          set -e
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export Signed IPA
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported:"
          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
