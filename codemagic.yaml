workflows:
  ios_adhoc_manual:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: 🧹 Clean Flutter environment
        script: |
          set -e
          echo "🧹 Cleaning Flutter cache..."
          flutter clean
          flutter pub get
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf /Users/builder/programs/flutter/bin/cache/artifacts/engine/*
          echo "✅ Flutter engine cache cleared."

      - name: 🧱 Rebuild Flutter engine (ios-release only)
        script: |
          set -e
          echo "🧱 Rebuilding Flutter engine for ios-release..."
          flutter precache --ios --force
          flutter build ios --release --no-codesign || true
          echo "✅ Flutter ios-release engine rebuilt."

      - name: 🧩 Copy correct Flutter.framework slice (ios-release/arm64)
        script: |
          set -e
          echo "🧩 Copying Flutter.framework (ios-release / arm64)..."

          FLUTTER_BIN=$(which flutter)
          FLUTTER_ROOT=$(dirname "$FLUTTER_BIN")/..
          ENGINE_DIR="$FLUTTER_ROOT/bin/cache/artifacts/engine"
          mkdir -p ios/Flutter

          DEVICE_SLICE="$ENGINE_DIR/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework"
          if [ ! -d "$DEVICE_SLICE" ]; then
            echo "❌ Flutter.framework ios-arm64 not found!"
            find "$ENGINE_DIR" -type d -name "Flutter.framework" | sed 's/^/   /'
            exit 1
          fi

          rm -rf ios/Flutter/Flutter.framework
          cp -R "$DEVICE_SLICE" ios/Flutter/
          echo "✅ Copied Flutter.framework from ios-release arm64 slice."

      - name: 🚀 Build iOS Archive (Ad Hoc)
        script: |
          set -e
          echo "🚀 Building iOS archive (AdHoc)..."
          flutter build ios --release --no-codesign
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export signed IPA (Ad Hoc)
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA Path
        script: |
          echo "📂 IPA ready at:"
          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
