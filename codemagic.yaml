workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "WonderSpaceGallery_AppStore_Profile"

    scripts:
      - name: 🧹 Clean & Prepare Environment
        script: |
          set -e
          echo "🧹 Cleaning Flutter and Pods..."
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/Runner.xcworkspace
          rm -rf ~/Library/Developer/Xcode/DerivedData
          flutter pub get
          cd ios
          pod repo update
          pod install
          cd ..
          echo "✅ Environment ready."

      - name: 🔄 Reset signing for all Pods
        script: |
          set -e
          echo "🔄 Resetting signing settings for Pods.xcodeproj..."
          cd ios
          if [ -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
            sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' Pods/Pods.xcodeproj/project.pbxproj || true
            sed -i '' '/CODE_SIGN_IDENTITY/d' Pods/Pods.xcodeproj/project.pbxproj || true
            sed -i '' '/DEVELOPMENT_TEAM/d' Pods/Pods.xcodeproj/project.pbxproj || true
            plutil -replace ProvisioningStyle -string "Automatic" "Pods/Pods.xcodeproj/project.pbxproj" || true
          fi
          cd ..
          echo "✅ Pods signing reset complete."

      - name: 🧾 Create exportOptions.plist
        script: |
          set -e
          mkdir -p build/ios
          cat > build/ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          echo "✅ exportOptions.plist created."

      - name: 🚀 Build iOS Release (Archive)
        script: |
          set -e
          echo "🚀 Archiving iOS app via Xcode..."
          mkdir -p build/ios/archive
          xcodebuild clean -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release | xcpretty

          xcodebuild archive -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES | tee build_log.txt | xcpretty

          if [ ! -d "build/ios/archive/Runner.xcarchive" ]; then
            echo "❌ Archive failed! Showing last 50 lines of Xcode log:"
            tail -n 50 build_log.txt
            exit 1
          fi
          echo "✅ Archive succeeded."

      - name: 🔧 Fix CFBundleIdentifiers in Frameworks
        script: |
          set -e
          echo "🔧 Fixing invalid CFBundleIdentifiers..."
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          find "$APP_PATH/Frameworks" -name Info.plist | while read plist; do
            CURRENT_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$plist" 2>/dev/null || true)
            FRAMEWORK_NAME=$(basename "$(dirname "$plist")" .framework)
            FIXED_ID="${BUNDLE_ID}.${FRAMEWORK_NAME}"
            if [ -z "$CURRENT_ID" ]; then
              echo "⚙️ Added missing CFBundleIdentifier: $FIXED_ID"
              /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $FIXED_ID" "$plist" || true
            fi
            if [[ "$CURRENT_ID" == *"_"* ]]; then
              FIXED_ID=$(echo "$CURRENT_ID" | sed 's/_/-/g')
              echo "🔄 Sanitized $CURRENT_ID → $FIXED_ID"
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $FIXED_ID" "$plist" || true
            fi
          done
          echo "✅ Framework Info.plists sanitized."

      - name: 📦 Export IPA
        script: |
          set -e
          echo "📦 Exporting signed IPA..."
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist build/ios/exportOptions.plist \
            -exportPath build/ios/ipa \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES | xcpretty
          echo "✅ IPA exported successfully."

      - name: 🧾 Verify IPA before upload
        script: |
          set -e
          echo "🔍 Verifying IPA structure..."
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA found. Something went wrong."
            exit 1
          fi
          unzip -q "$IPA_PATH" -d ipa_check
          find ipa_check -name Info.plist | while read plist; do
            ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$plist" 2>/dev/null || true)
            if [ -z "$ID" ]; then
              echo "❌ Missing CFBundleIdentifier in $plist"
              exit 1
            fi
          done
          echo "✅ IPA verified successfully."
          rm -rf ipa_check

      - name: 📋 Show IPA
        script: |
          echo "📂 Generated IPA files:"
          find build/ios/ipa -type f -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
