workflows:
  ios_adhoc_manual:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    cache:
      cache_paths: []

    scripts:
      - name: 🧹 Clean Flutter + ensure iOS configs
        script: |
          set -e
          echo "🧹 Cleaning Flutter build..."
          flutter clean
          flutter pub get
          flutter precache --ios

          echo "🧩 Ensuring iOS config structure exists..."
          mkdir -p ios/Flutter
          if [ ! -f ios/Flutter/Release.xcconfig ]; then
            echo "// Generated manually to fix build path" > ios/Flutter/Release.xcconfig
          fi
          if [ ! -f ios/Flutter/Debug.xcconfig ]; then
            echo "// Generated manually to fix build path" > ios/Flutter/Debug.xcconfig
          fi

          echo "✅ Flutter configs prepared."

      - name: 📦 Install Pods safely
        script: |
          set -e
          cd ios
          echo "🧱 Reinstalling Pods..."
          pod deintegrate || true
          pod repo update
          pod install

          # 🧩 Create missing xcfilelists if absent
          mkdir -p "Target Support Files/Pods-Runner"
          for f in \
            "Pods-Runner-frameworks-Release-input-files.xcfilelist" \
            "Pods-Runner-frameworks-Release-output-files.xcfilelist" \
            "Pods-Runner-resources-Release-input-files.xcfilelist" \
            "Pods-Runner-resources-Release-output-files.xcfilelist"; do
            if [ ! -f "Target Support Files/Pods-Runner/$f" ]; then
              echo "// empty xcfilelist (autogenerated)" > "Target Support Files/Pods-Runner/$f"
            fi
          done
          cd ..
          echo "✅ Pods ready."

      - name: 🧱 Rebuild Flutter engine (ios-release)
        script: |
          set -e
          flutter build ios --release --no-codesign || true
          echo "✅ Flutter engine rebuilt."

      - name: 🧩 Copy Flutter.framework (ios-release arm64)
        script: |
          set -e
          echo "🧩 Detecting Flutter SDK..."
          FLUTTER_BIN=$(which flutter)
          FLUTTER_ROOT=$(dirname "$FLUTTER_BIN")/..
          if [ ! -d "$FLUTTER_ROOT/bin/cache/artifacts/engine" ]; then
            FLUTTER_ROOT="/Users/builder/programs/flutter"
          fi
          ENGINE_DIR="$FLUTTER_ROOT/bin/cache/artifacts/engine"
          DEVICE_SLICE=$(find "$ENGINE_DIR" -type d -path "*/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework" | head -n 1)

          if [ -z "$DEVICE_SLICE" ]; then
            echo "❌ Could not locate ios-arm64 Flutter.framework!"
            find "$ENGINE_DIR" -type d -name "Flutter.framework" | sed 's/^/   /'
            exit 1
          fi

          mkdir -p ios/Flutter
          rm -rf ios/Flutter/Flutter.framework
          cp -R "$DEVICE_SLICE" ios/Flutter/
          echo "✅ Copied Flutter.framework (ios-release arm64)."

      - name: 🚀 Build iOS Archive (Ad Hoc)
        script: |
          set -e
          echo "🚀 Building archive..."
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export signed IPA (Ad Hoc)
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA Path
        script: |
          echo "📂 IPA ready at:"
          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
