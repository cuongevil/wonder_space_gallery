workflows:
  ios_adhoc_manual:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: 🧹 Clean & Install Pods
        script: |
          set -e
          flutter clean
          flutter pub get
          cd ios
          pod repo update
          pod install
          cd ..

      - name: 🧱 Force correct Flutter.framework slice (v10.7 definitive)
        script: |
          set -e
          echo "🧱 Forcing correct Flutter.framework slice (ios-release / ios-arm64)..."

          flutter precache --ios
          FLUTTER_BIN=$(which flutter)
          FLUTTER_ROOT=$(dirname "$FLUTTER_BIN")/..
          ENGINE_DIR="$FLUTTER_ROOT/bin/cache/artifacts/engine"
          mkdir -p ios/Flutter

          DEVICE_SLICE="$ENGINE_DIR/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework"
          echo "🔍 Checking slice: $DEVICE_SLICE"

          if [ ! -d "$DEVICE_SLICE" ]; then
            echo "⚠️ Not found at ios-release, trying fallback..."
            DEVICE_SLICE="/Users/builder/programs/flutter/bin/cache/artifacts/engine/ios-release/Flutter.xcframework/ios-arm64/Flutter.framework"
          fi

          if [ ! -d "$DEVICE_SLICE" ]; then
            echo "❌ Could not locate Flutter.framework ios-arm64 slice!"
            echo "Available Flutter.framework paths:"
            find "$ENGINE_DIR" -type d -name "Flutter.framework" 2>/dev/null | sed 's/^/   /'
            exit 1
          fi

          rm -rf ios/Flutter/Flutter.framework
          cp -R "$DEVICE_SLICE" ios/Flutter/
          echo "✅ Copied Flutter.framework from ios-release/ios-arm64 slice."

      - name: 🧩 Regenerate missing Xcode config & xcfilelists (v10.7)
        script: |
          set -e
          echo "🧩 Regenerating missing Xcode configuration and filelists..."
          mkdir -p ios/Flutter
          cat > ios/Flutter/Release.xcconfig <<EOF
          #include "Generated.xcconfig"
          FLUTTER_BUILD_MODE=release
          EOF
          echo "✅ Recreated ios/Flutter/Release.xcconfig"

          PODS_DIR="ios/Pods/Target Support Files/Pods-Runner"
          mkdir -p "$PODS_DIR"

          echo "Pods/../Flutter/Flutter.framework" > "$PODS_DIR/Pods-Runner-frameworks-Release-input-files.xcfilelist"
          echo "build/ios/Release-iphoneos/Pods_Runner.framework" > "$PODS_DIR/Pods-Runner-frameworks-Release-output-files.xcfilelist"
          echo "Pods/../Resources/*" > "$PODS_DIR/Pods-Runner-resources-Release-input-files.xcfilelist"
          echo "build/ios/Release-iphoneos/Resources/*" > "$PODS_DIR/Pods-Runner-resources-Release-output-files.xcfilelist"
          echo "✅ Recreated missing Pods xcfilelist files"

      - name: 🚀 Build iOS Archive (Ad Hoc)
        script: |
          set -e
          echo "🚀 Building iOS archive (AdHoc)..."
          flutter build ios --release --no-codesign
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export signed IPA (Ad Hoc)
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA Path
        script: |
          echo "📂 IPA ready at:"
          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
