workflows:
  ios_adhoc_manual:
    name: iOS AdHoc (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "wonderspace_gallery_adhoc"

    scripts:
      - name: 🧹 Clean & Install Pods
        script: |
          set -e
          flutter clean
          flutter pub get
          cd ios
          pod repo update
          pod install
          cd ..

      - name: 🧱 Fix Flutter.framework slice (v10.4 definitive)
        script: |
          set -e
          echo "🧱 Detecting correct Flutter.framework slice for iOS device..."

          flutter precache --ios
          FLUTTER_BIN=$(which flutter)
          FLUTTER_ROOT=$(dirname "$FLUTTER_BIN")/..
          ENGINE_DIR="$FLUTTER_ROOT/bin/cache/artifacts/engine"

          mkdir -p ios/Flutter
          echo "🔍 Searching for device slice (ios-arm64)..."
          DEVICE_SLICE=$(find "$ENGINE_DIR" -type d -path "*/ios*/Flutter.xcframework/ios-arm64/Flutter.framework" | grep -v "simulator" | head -n 1)

          if [ -z "$DEVICE_SLICE" ]; then
            echo "❌ Could not find ios-arm64 slice! Listing available:"
            find "$ENGINE_DIR" -type d -name "Flutter.framework" | sed 's/^/   /'
            exit 1
          fi

          echo "✅ Using Flutter.framework slice: $DEVICE_SLICE"
          rm -rf ios/Flutter/Flutter.framework
          cp -R "$DEVICE_SLICE" ios/Flutter/
          echo "✅ Flutter.framework copied successfully."

      - name: 🚀 Build iOS Archive (Ad Hoc)
        script: |
          set -e
          flutter build ios --release --no-codesign
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: 📦 Export signed IPA (Ad Hoc)
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/exportOptions_adhoc.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA Path
        script: |
          echo "📂 IPA ready:"
          find build/ios/ipa -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
