workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROFILE_NAME: "WonderSpaceGallery_AppStore_Profile"

    scripts:
      - name: 🧹 Clean & Prepare
        script: |
          set -e
          echo "🧹 Cleaning Flutter project..."
          flutter clean
          flutter pub get
          cd ios && pod repo update && pod install && cd ..
          echo "✅ Pods installed successfully."

      - name: 🔄 Deep reset signing
        script: |
          set -e
          echo "🔄 Resetting all signing settings recursively..."
          find ios -name "project.pbxproj" -print0 | while IFS= read -r -d '' file; do
            echo "🧹 Cleaning $file ..."
            sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' "$file" || true
            sed -i '' '/CODE_SIGN_IDENTITY/d' "$file" || true
            sed -i '' '/DEVELOPMENT_TEAM/d' "$file" || true
            sed -i '' '/CODE_SIGN_STYLE/d' "$file" || true
          done
          echo "✅ Deep signing reset completed."

      - name: 🧾 Create exportOptions.plist
        script: |
          set -e
          mkdir -p build/ios
          cat > build/ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key>
            <string>export</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "✅ exportOptions.plist created."

      - name: 🚀 Build iOS Release (Archive)
        script: |
          set -e
          echo "🚀 Archiving iOS app via Xcode..."
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_IDENTITY="${CERT_NAME}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            OTHER_CODE_SIGN_FLAGS="--deep --force" \
            | tee build_log.txt | xcpretty
          echo "✅ Archive completed."

      - name: 📦 Export signed IPA
        script: |
          set -e
          echo "📦 Exporting signed IPA..."
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist build/ios/exportOptions.plist \
            -exportPath build/ios/ipa
          echo "✅ IPA exported successfully."

      - name: 📋 Show IPA
        script: |
          echo "📂 Generated IPA files:"
          find build/ios/ipa -type f -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
