workflows:
  ios_release_manual:
    name: iOS Release (Wonder Space Gallery)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - ios_credentials     # ← chứa .p12 + .mobileprovision
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctmd.wonderforge.wonderspace.gallery
      vars:
        TEAM_ID: "CS2UV6F3ZY"
        BUNDLE_ID: "com.ctmd.wonderforge.wonderspace.gallery"
        CERT_NAME: "Apple Distribution: Cuong Nguyen Ba (CS2UV6F3ZY)"
        PROVISIONING_PROFILE_SPECIFIER: "WonderSpaceGallery_AppStore_Profile"

    scripts:
      - name: 🧹 Clean & Prepare
        script: |
          set -e
          echo "🧹 Cleaning Flutter build..."
          flutter clean
          flutter pub get
          cd ios
          pod repo update
          pod install
          cd ..

      - name: 🔎 Debug Certificates
        script: |
          echo "🔎 Checking available code signing identities..."
          security find-identity -v -p codesigning || echo "⚠️ No identities found!"

      - name: 🧾 Create exportOptions.plist
        script: |
          set -e
          mkdir -p build/ios
          cat > build/ios/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_SPECIFIER</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          echo "✅ exportOptions.plist created."

      - name: 🚀 Build iOS Release (Xcode)
        script: |
          set -e
          echo "🚀 Archiving project with Xcode..."
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -archivePath build/ios/archive/Runner.xcarchive \
            -configuration Release \
            DEVELOPMENT_TEAM=$TEAM_ID \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            CODE_SIGN_IDENTITY="$CERT_NAME" \
            clean archive

          echo "📦 Exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist build/ios/exportOptions.plist \
            -exportPath build/ios/ipa

          echo "✅ IPA exported to build/ios/ipa"

      - name: 📋 List IPA Output
        script: |
          echo "📂 IPA files generated:"
          find build/ios/ipa -type f -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
